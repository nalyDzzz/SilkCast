name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify tag matches app version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const tagVersion = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const cargoToml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const readJsonVersion = (file) =>
            JSON.parse(fs.readFileSync(file, 'utf8')).version;
          const versions = {
            'package.json': readJsonVersion('package.json'),
            'src-tauri/tauri.conf.json': readJsonVersion('src-tauri/tauri.conf.json'),
            'src-tauri/Cargo.toml': /^version\s*=\s*"([^"]+)"/m.exec(cargoToml)?.[1],
          };
          const mismatched = Object.entries(versions).filter(
            ([, version]) => version !== tagVersion
          );
          if (mismatched.length > 0) {
            for (const [file, version] of mismatched) {
              console.error(`::error file=${file}::version ${version} does not match tag v${tagVersion}`);
            }
            console.error('Bump the version in every file above before tagging; the updater compares app versions, not tags.');
            process.exit(1);
          }
          console.log(`All manifests are at ${tagVersion}.`);
          NODE

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install MPV runtime
        shell: powershell
        run: |
          function Find-LibMpvDll {
            param(
              [string[]]$Roots,
              [string[]]$Names
            )

            foreach ($name in $Names) {
              foreach ($root in $Roots) {
                if (-not (Test-Path $root)) {
                  continue
                }
                $candidate = Get-ChildItem -Path $root -Recurse -File -Filter $name -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($candidate) {
                  return $candidate
                }
              }
            }

            return $null
          }

          choco install mpv -y --no-progress

          $dllNames = @("mpv-2.dll", "libmpv-2.dll", "mpv.dll")
          $searchRoots = @(
            "C:\ProgramData\chocolatey\lib\mpv\tools",
            "C:\ProgramData\chocolatey\lib\mpvio.install\tools",
            "C:\ProgramData\chocolatey\lib\mpv",
            "C:\ProgramData\chocolatey\lib\mpvio.install",
            "C:\ProgramData\chocolatey\lib"
          ) | Where-Object { Test-Path $_ }

          $foundDll = Find-LibMpvDll -Roots $searchRoots -Names $dllNames

          if (-not $foundDll) {
            Write-Host "No libmpv DLL found in Chocolatey mpv package. Falling back to shinchiro mpv-dev build."

            if (-not (Get-Command 7z.exe -ErrorAction SilentlyContinue)) {
              choco install 7zip -y --no-progress
            }

            $sevenZipPath = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
            if (-not $sevenZipPath -and (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
              $sevenZipPath = "C:\Program Files\7-Zip\7z.exe"
            }
            if (-not $sevenZipPath) {
              throw "7z.exe not found after installing 7zip."
            }

            $releaseApi = "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest"
            $release = Invoke-RestMethod -Uri $releaseApi -Headers @{
              "Accept" = "application/vnd.github+json"
              "User-Agent" = "silkcast-release-workflow"
            }

            $assetPatterns = @(
              '^mpv-dev-x86_64-[0-9]{8}-git-.*\.7z$',
              '^mpv-dev-x86_64-v3-[0-9]{8}-git-.*\.7z$',
              '^mpv-dev-x86_64-gcc-[0-9]{8}-git-.*\.7z$',
              '^mpv-dev-x86_64.*\.7z$'
            )

            $selectedAsset = $null
            foreach ($pattern in $assetPatterns) {
              $selectedAsset = $release.assets | Where-Object { $_.name -match $pattern } | Select-Object -First 1
              if ($selectedAsset) {
                break
              }
            }

            if (-not $selectedAsset) {
              throw "Could not locate an mpv-dev x86_64 asset in shinchiro/mpv-winbuild-cmake latest release."
            }

            $archivePath = Join-Path $env:RUNNER_TEMP $selectedAsset.name
            $extractDir = Join-Path $env:RUNNER_TEMP "mpv-dev-runtime"

            Invoke-WebRequest -Uri $selectedAsset.browser_download_url -OutFile $archivePath
            if (Test-Path $extractDir) {
              Remove-Item -Path $extractDir -Recurse -Force
            }
            New-Item -Path $extractDir -ItemType Directory | Out-Null

            & $sevenZipPath x $archivePath "-o$extractDir" -y | Out-Null

            $foundDll = Find-LibMpvDll -Roots @($extractDir) -Names $dllNames
            if (-not $foundDll) {
              throw "Fallback mpv-dev archive was extracted but no libmpv DLL was found. Tried: $($dllNames -join ', ')"
            }
          }

          $mpvDllDir = Split-Path -Path $foundDll.FullName -Parent
          Write-Host "Using MPV runtime directory: $mpvDllDir"
          "MPV_DLL_DIR=$mpvDllDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci

      - name: Prepare MPV runtime bundle
        run: npm run prepare:mpv-runtime:strict

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SilkCast ${{ github.ref_name }}"
          releaseBody: "Automated installer build for ${{ github.ref_name }}."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis,msi
