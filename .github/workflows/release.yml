name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install MPV runtime
        shell: powershell
        run: |
          choco install mpv -y --no-progress
          $mpvDll = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\mpv" -Recurse -Filter "mpv-2.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $mpvDll) {
            throw "mpv-2.dll not found after Chocolatey install."
          }
          $mpvDllDir = Split-Path -Path $mpvDll.FullName -Parent
          "MPV_DLL_DIR=$mpvDllDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci

      - name: Prepare MPV runtime bundle
        run: npm run prepare:mpv-runtime:strict

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SilkCast ${{ github.ref_name }}"
          releaseBody: "Automated installer build for ${{ github.ref_name }}."
          releaseDraft: true
          prerelease: false
          args: --bundles nsis,msi
