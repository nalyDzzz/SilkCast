name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install MPV runtime
        shell: powershell
        run: |
          choco install mpv -y --no-progress
          $dllNames = @("mpv-2.dll", "libmpv-2.dll", "mpv.dll")
          $searchRoots = @(
            "C:\ProgramData\chocolatey\lib\mpv\tools",
            "C:\ProgramData\chocolatey\lib\mpvio.install\tools",
            "C:\ProgramData\chocolatey\lib\mpv",
            "C:\ProgramData\chocolatey\lib\mpvio.install",
            "C:\ProgramData\chocolatey\lib"
          ) | Where-Object { Test-Path $_ }

          $foundDll = $null
          foreach ($name in $dllNames) {
            foreach ($root in $searchRoots) {
              $candidate = Get-ChildItem -Path $root -Recurse -File -Filter $name -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($candidate) {
                $foundDll = $candidate
                break
              }
            }
            if ($foundDll) { break }
          }

          if (-not $foundDll) {
            Write-Host "Searched roots:"
            $searchRoots | ForEach-Object { Write-Host " - $_" }
            throw "No libmpv runtime DLL found after Chocolatey install. Tried: $($dllNames -join ', ')"
          }

          $mpvDllDir = Split-Path -Path $foundDll.FullName -Parent
          Write-Host "Using MPV runtime directory: $mpvDllDir"
          "MPV_DLL_DIR=$mpvDllDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci

      - name: Prepare MPV runtime bundle
        run: npm run prepare:mpv-runtime:strict

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SilkCast ${{ github.ref_name }}"
          releaseBody: "Automated installer build for ${{ github.ref_name }}."
          releaseDraft: true
          prerelease: false
          args: --bundles nsis,msi
