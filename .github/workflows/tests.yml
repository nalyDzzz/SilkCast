name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

# A newer push to the same PR or branch supersedes the run in progress.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Tauri pulls in ~480 crates; without this every run compiles them all.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Azure's Ubuntu mirror is sometimes extremely slow (one run spent 31
      # minutes downloading these packages at 39 kB/s), so keep the .debs.
      - name: Cache Linux packages
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/tests.yml') }}
          restore-keys: apt-${{ runner.os }}-

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
          # Drop superseded package versions and let the cache step read the files.
          sudo apt-get autoclean -o Dir::Cache::Archives="$HOME/apt-archives"
          sudo chown -R "$USER" ~/apt-archives

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm run test:all
